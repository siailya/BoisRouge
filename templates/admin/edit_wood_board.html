{% extends 'admin/admin.html' %}

{% block content %}
  <div class="d-flex mb-5">
    <a href="/admin/add_wood_board" class="ms-auto add-new-btn">
      <button class="btn btn-success d-flex">
        Добавить доску <span class="material-icons-outlined ms-2 my-auto">add</span>
      </button>
    </a>
  </div>

  <div class="row">
    {% for wood_board in wood_boards %}
      <div class="col-12 col-md-6 col-lg-4 mb-3" style="">
        <a href="edit_wood_board/{{ wood_board._id }}" class="d-flex flex-column card"
           style="
             color: black;
             cursor: pointer;
             text-align: center;
             position: relative;
             border-radius: 5px 5px 5px 5px;
             text-decoration: none;
             padding: 5px;
             margin: auto;
             height: 100%;"
        >

          <div class="new-text text-start p-3">
            {% if wood_board.wood_board_title|length > 140 %}
              {{ wood_board.wood_board_title[:140] }}...
            {% else %}
              {{ wood_board.wood_board_title }}
            {% endif %}
          </div>

          <img src='{{ url_for("static", filename="/photos/" + wood_board.photo_path) }}' alt=""
               style="height: 30vh; padding: 0; border: none; object-fit: cover;" class="img-thumbnail mt-auto"/>
        </a>
      </div>
    {% endfor %}
  </div>
{% endblock %}
