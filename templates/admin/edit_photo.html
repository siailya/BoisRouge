{% extends 'admin/admin.html' %}

{% block content %}
  <div class="d-flex mb-5">
    <a href="/add_new" class="ms-auto add-new-btn">
      <button class="btn btn-success d-flex">
        Добавить новость <span class="material-icons-outlined ms-2 my-auto">add</span>
      </button>
    </a>
  </div>

  <div class="row">
    {% for photo in photos %}
      <div class="col-12 col-md-6 col-lg-4 mb-3" style="">
        <a href="edit_photo/{{ photo._id }}" class="d-flex flex-column card"
           style="
             color: black;
             cursor: pointer;
             text-align: center;
             position: relative;
             border-radius: 5px 5px 5px 5px;
             text-decoration: none;
             padding: 5px;
             margin: auto;
             height: 100%;"
        >
          <div
              style="color: black; font-size: 18px; border-radius: 5px 5px 5px 5px;"
          >
          </div>

          <img src='{{ url_for("static", filename="/news_photo/" + photo.path) }}' alt=""
          style="height: 30vh; padding: 0; border: none; object-fit: cover;" class="img-thumbnail mt-auto"/>

          <div class="new-text text-start p-3">
            {% if photo.description|length > 140 %}
              {{ photo.description[:140] }}...
            {% else %}
              {{ photo.description }}
            {% endif %}
          </div>

          <p class="text-end news-date mt-2">
            {{ photo.date }}
          </p>
        </a>
      </div>
    {% endfor %}
  </div>
{% endblock %}
