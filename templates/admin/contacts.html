{% extends 'admin/admin.html' %}

{% block content %}
  <h1 class="display-6">Контакты</h1>
  <form method="post" novalidate enctype="multipart/form-data">
    <div id="parentId">
      {% for contact in contacts %}
        <div style="display: flex">
          <select name="type" class="form-select form-select-lg mb-3 me-3" style="width: 20vw">
            {% if contact["type"] == "e-mail" %}
              <option value="e-mail" selected>Почта</option>
            {% else %}
              <option value="e-mail">Почта</option>
            {% endif %}

            {% if contact["type"] == "phone" %}
              <option value="phone" selected>Телефон</option>
            {% else %}
              <option value="phone">Телефон</option>
            {% endif %}

            {% if contact["type"] == "social_network" %}
              <option value="social_network" selected>Социальная сеть</option>
            {% else %}
              <option value="social_network">Социальная сеть</option>
            {% endif %}
          </select>
          <input name="value" class="form-control form-control-lg mb-3" type="text" value={{ contact["value"] }}>
          <input name="id" type="text" style="visibility: hidden; width: 0" value="{{ contact["_id"] }}"/>
          <a style="color:var(--bs-danger);" onclick="return deleteField(this)" href='#'><i class='material-icons-outlined'
                                                                               style='font-size: 5vh'>cancel</i></a>
        </div>
      {% endfor %}
    </div>
    <div class="d-flex justify-content-center">
      <button class="btn btn-outline-success" onclick="return addField()">Добавить контакт</button>
    </div>
    <div class="mt-3 d-flex">
      {{ contact_form.submit(class="btn btn-primary btn-success me-2") }}
      <a href="/admin"><button class="btn btn-warning" type="button">Сбросить</button></a>
    </div>
  </form>

  <script>
      function deleteField(a) {
          var contDiv = a.parentNode;
          contDiv.parentNode.removeChild(contDiv);
          return false;
      }

      function addField() {
          var div = document.createElement("div");
          div.style.display = "flex"
          div.innerHTML = "<select name='type' class='form-select form-select-lg mb-3 me-3' style='width: 20vw'>" +
              "<option value='e-mail'>Почта</option>" +
              "<option value='phone'>Телефон</option>" +
              "<option value='social_network'>Социальная сеть</option></select>" +
              "<input name='value' class='form-control form-control-lg mb-3' type='text'/> " +
              "<input name='id' type='text' style='visibility: hidden; width: 0' /> " +
              "<a style='color:red;' onclick='return deleteField(this)' href='#'><i class='material-icons-outlined' style='font-size: 5vh'>cancel</i></a>";
          document.getElementById("parentId").appendChild(div);
          return false;
      }
  </script>
{% endblock %}
