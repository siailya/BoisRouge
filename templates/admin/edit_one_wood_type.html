{% extends 'admin/admin.html' %}

{% block content %}
  <form action="" method="post" novalidate enctype="multipart/form-data">
    <p style="align-items: center; justify-content: center;">
      <img src='{{ url_for("static", filename="/news_photo/" + wood_type["path"]) }}' alt=""
           style="height: 30vh; display: flex; text-align: center; margin: auto"
           class="img-thumbnail mt-auto"/>
    </p>

    <label class="form-label">Название</label>
    <input type="text" name="title" class="form-control" value="{{ wood_type["title"] }}">

    <div class="mb-3">
      <label class="form-label">Описание</label>
      <textarea class="form-control" rows="3" name="description">{{ wood_type["description"] }}</textarea>
    </div>


    <div class="mb-3">
      {{ wood_type_form.submit(class="btn btn-success btn-md mb-2") }}
      <button type="button" class="btn btn-danger btn-md mb-2" data-bs-toggle="modal" data-bs-target="#delete">
        Удалить новость
      </button>
      <div class="modal fade" id="delete" tabindex="-1" aria-labelledby="delete" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="deleteLabel">Подтверждение действия</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              Вы действительно хотите удалить новость?
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Нет</button>
              <button type="submit" class="btn btn-primary" name="delete">Да</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
{% endblock %}
