          <h1 class="display-6">Добавить фотографию в галерею</h1>
          <form>
            <div class="mb-3">
              <input class = "form-control" type="file" id="files" name="files[]"  multiple />
              <ul id="list"></ul>
            </div>
            <div class="mb-3">
              <button type="submit" class="btn btn-primary mb-2">Добавить</button>
            </div>
          </form>

          <script>
              function showFile(e) {
              var files = e.target.files;
              for (var i = 0, f; f = files[i]; i++) {
                if (!f.type.match('image.*')) continue;
                var fr = new FileReader();
                fr.onload = (function(theFile) {
                  return function(e) {
                    var li = document.createElement('li');
                    li.innerHTML = "<img src='" + e.target.result + "' class='img-thumbnail' style='width: 30vh' />";
                    li.innerHTML += "<input type='text'>"
                    document.getElementById('list').insertBefore(li, null);
                  };
                })(f);

                fr.readAsDataURL(f);
              }
            }

            document.getElementById('files').addEventListener('change', showFile, false);
          </script>

        </div>
      </div>
      </div>
